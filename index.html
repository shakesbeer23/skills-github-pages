/* ============================================================
   Storage adapter

   ============================================================ */
const STORE = (() => {
  const cfg = window.APP_CONFIG || {};
  const url = (cfg.SUPABASE_URL || "").replace(/\/+$/, "");
  const key = cfg.SUPABASE_ANON_KEY || "";

  if (!url || !key) {
    return {
      mode: "local",
      async load() {
        const v = localStorage.getItem(KEY);
        return v ? JSON.parse(v) : null;
      },
      async save(d) {
        localStorage.setItem(KEY, JSON.stringify(d));
      }
    };
  }

  const base = url + "/rest/v1/app_state";

  // Legacy anon keys are JWTs and want a Bearer header.
  // Newer sb_publishable_ keys authenticate on the apikey header alone.
  const headers = { apikey: key, "Content-Type": "application/json" };
  if (key.startsWith("eyJ")) headers.Authorization = "Bearer " + key;

  const explain = async (r, verb) => {
    let detail = "";
    try { const j = await r.json(); detail = j.message || j.hint || ""; } catch (e) {}
    if (r.status === 401 || r.status === 403)
      return verb + " refused (" + r.status + "). The key is wrong, or the row policies do not match. " + detail;
    if (r.status === 404)
      return verb + " hit a missing table (404). Check the project URL and that app_state exists. " + detail;
    return verb + " failed (" + r.status + "). " + detail;
  };

  return {
    mode: "supabase",
    async load() {
      let r;
      try {
        r = await fetch(base + "?id=eq." + KEY + "&select=data", { headers });
      } catch (e) {
        throw new Error("Could not reach " + url + ". The project may be paused, the URL may be wrong, or this device is offline.");
      }
      if (!r.ok) throw new Error(await explain(r, "Load"));
      const rows = await r.json();
      return rows.length ? rows[0].data : null;
    },
    async save(d) {
      let r;
      try {
        r = await fetch(base, {
          method: "POST",
          headers: Object.assign({}, headers, {
            Prefer: "resolution=merge-duplicates,return=minimal"
          }),
          body: JSON.stringify({ id: KEY, data: d, updated_at: new Date().toISOString() })
        });
      } catch (e) {
        throw new Error("Could not reach " + url + " to save. Check the connection.");
      }
      if (!r.ok) throw new Error(await explain(r, "Save"));
    }
  };
})();

  const b = breed;
  const shade = (hex, amt) => {
    const n = parseInt(hex.slice(1),16);
    const r = Math.max(0,Math.min(255,((n>>16)&255)+amt));
    const g = Math.max(0,Math.min(255,((n>>8)&255)+amt));
    const bl = Math.max(0,Math.min(255,(n&255)+amt));
    return "#" + ((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
  };
  const dark = shade(b.body,-34);
  const hoof = "#2B231C";
  const build = {
    pony:{s:.9,leg:46,barrel:30,y:14},

/* ============================================================
   App
   ============================================================ */
function App() {
  const [data, setData] = useState(null);
  const [loadErr, setLoadErr] = useState("");
  const [saveErr, setSaveErr] = useState("");
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState("card");
  const [confirmWipe, setConfirmWipe] = useState(false);
  const first = useRef(true);
  const dirty = useRef(false);

  const pull = async (silent) => {
    try {
      const d = await STORE.load();
      if (d) {
        setData(d);
      } else if (!silent) {
        setData(SEED);
      }
      setLoadErr("");
    } catch (e) {
      if (!silent) {
        setLoadErr(e.message || "Could not reach the data store.");
        setData(SEED);
      }
    }
  };

  useEffect(() => { pull(false); }, []);

  /* refresh when the tab comes back to the front, so both phones stay in step */
  useEffect(() => {
    if (STORE.mode !== "supabase") return;
    const onVis = () => { if (!document.hidden && !dirty.current) pull(true); };
    document.addEventListener("visibilitychange", onVis);
    const t = setInterval(() => { if (!document.hidden && !dirty.current) pull(true); }, 45000);
    return () => { document.removeEventListener("visibilitychange", onVis); clearInterval(t); };
  }, []);

  useEffect(() => {
    if (!data) return;
    if (first.current) { first.current = false; return; }
    let alive = true;
    dirty.current = true;
    setSaving(true);
    (async () => {
      try {
        await STORE.save(data);
        if (alive) setSaveErr("");
      } catch (e) {
        if (alive) setSaveErr((e.message || "That change did not save.") + " Your edit is still on screen, so try again once it is fixed.");
      } finally {
        if (alive) { setSaving(false); dirty.current = false; }
      }
    })();
    return () => { alive = false; };
  }, [data]);

  const patch = (fn) => setData((d) => fn(Object.assign({}, d)));
  const today = todayISO();

  const rides = useMemo(() => {
    if (!data) return [];
    return data.rides.map((r) => {
      const auto = r.status === "booked" && r.date && r.date < today;
      return Object.assign({}, r, { effective: auto ? "ridden" : r.status, auto });
    }).sort((a,b) => {
      if (!a.date) return -1;
      if (!b.date) return 1;
      return b.date.localeCompare(a.date);
    });
  }, [data, today]);

  const stats = useMemo(() => {
    if (!data) return null;
    const bought = data.purchases.reduce((s,p) => s + Number(p.lessons||0), 0);
    const adj = data.adjustments.reduce((s,a) => s + Number(a.amount||0), 0);
    const used = rides.filter(r => r.effective === "ridden" && !r.iea).length;
    const iea = rides.filter(r => r.effective === "ridden" && r.iea).length;
    const booked = rides.filter(r => r.effective === "booked" && !r.iea).length;
    const paid = data.purchases.reduce((s,p) => s + (p.amount === "" ? 0 : Number(p.amount)||0), 0);
    const paidLessons = data.purchases.reduce((s,p) => p.amount === "" ? s : s + Number(p.lessons||0), 0);
    return { bought, adj, used, iea, booked, paid, avg: paidLessons ? paid/paidLessons : null, remaining: bought + adj - used };
  }, [data, rides]);

  const spend = useMemo(() => {
    if (!data) return [];
    const m = {};
    data.purchases.forEach(p => {
      if (p.amount === "" || !p.date) return;
      const k = p.date.slice(0,7);
      m[k] = (m[k]||0) + Number(p.amount||0);
    });
    return Object.entries(m).sort((a,b) => a[0].localeCompare(b[0]));
  }, [data]);

  const daily = useMemo(() => {
    const i = dayIndex();
    return i % 2 === 0
      ? { kind:"breed", item: BREEDS[Math.floor(i/2) % BREEDS.length] }
      : { kind:"fact", item: FACTS[Math.floor(i/2) % FACTS.length] };
  }, []);

  const addRide = (r) => patch(d => Object.assign({}, d, { rides: [Object.assign({id:uid(),time:"",note:""}, r)].concat(d.rides) }));
  const setRide = (id, c) => patch(d => Object.assign({}, d, { rides: d.rides.map(r => r.id === id ? Object.assign({}, r, c) : r) }));
  const delRide = (id) => patch(d => Object.assign({}, d, { rides: d.rides.filter(r => r.id !== id) }));
  const addPurchase = (p) => patch(d => Object.assign({}, d, { purchases: [Object.assign({id:uid()}, p)].concat(d.purchases) }));
  const setPurchase = (id, c) => patch(d => Object.assign({}, d, { purchases: d.purchases.map(p => p.id === id ? Object.assign({}, p, c) : p) }));
  const delPurchase = (id) => patch(d => Object.assign({}, d, { purchases: d.purchases.filter(p => p.id !== id) }));
  const addAdj = (a) => patch(d => Object.assign({}, d, { adjustments: [Object.assign({id:uid()}, a)].concat(d.adjustments) }));
  const delAdj = (id) => patch(d => Object.assign({}, d, { adjustments: d.adjustments.filter(a => a.id !== id) }));

  const exportCSV = () => {
    const rows = [["Type","Date","Time","Status/Payment","Lessons","Amount","Per lesson","Note"]];
    data.purchases.forEach(p => rows.push(["Purchase",p.date,"",
      p.payType==="card" ? "Card: "+p.cardName : p.payType==="check" ? "Check "+p.checkNumber : "Not recorded",
      p.lessons,p.amount,p.perLesson,p.note]));
    rides.forEach(r => rows.push(["Lesson", r.date||"No date", r.time, r.effective+(r.iea?" (IEA, not counted)":"")+(r.auto?" (auto)":""),"","","",r.note]));
    data.adjustments.forEach(a => rows.push(["Adjustment",a.date,"","",a.amount,"","",a.note]));
    rows.push([]);
    rows.push(["Lessons bought",stats.bought]);
    rows.push(["Adjustments",stats.adj]);
    rows.push(["Lessons used",stats.used]);
    rows.push(["IEA lessons (not counted)",stats.iea]);
    rows.push(["Lessons left",stats.remaining]);
    rows.push(["Total paid",stats.paid]);
    const csv = rows.map(r => r.map(c => '"' + String(c==null?"":c).replace(/"/g,'""') + '"').join(",")).join("\n");
    const url = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    const a = document.createElement("a");
    a.href = url; a.download = "riding-lessons-" + today + ".csv"; a.click();
    URL.revokeObjectURL(url);
  };

  if (!data) return <div className="wrap"><div className="loading">Opening the lesson card&hellip;</div></div>;

  const low = stats.remaining <= 3;

  return (
    <div className="wrap">
      <header className="hdr">
        <div className="hdr-rule" />
        <p className="eyebrow">Lesson card</p>
        <h1 className="title">{data.riderName}</h1>
        <p className="sub">{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</p>
      </header>

      {STORE.mode === "local" &&
        <div className="notice">
          Saving to this device only. Entries made here will not show up on the other phone.
          Add the Supabase URL and key at the top of index.html to sync.
        </div>}
      {loadErr && <div className="alert">{loadErr}</div>}
      {saveErr && <div className="alert">{saveErr}</div>}

      <section className="punchcard">
        <div className="punch-head">
          <span className="punch-label">Lessons left</span>
          {saving && <span className="saving">saving</span>}
        </div>
        <div className="punch-grid" aria-hidden="true">
          {Array.from({length: Math.max(stats.bought + stats.adj, 0)}).map((_,i) =>
            <span key={i} className={i < stats.used ? "hole punched" : "hole"}
                  style={{animationDelay: Math.min(i*9,600) + "ms"}} />)}
        </div>
        <div className="punch-foot">
          <span className="bignum">{stats.remaining}</span>
          <span className="ofnum">of {stats.bought + stats.adj} bought &middot; {stats.used} ridden{stats.iea ? " \u00b7 " + stats.iea + " IEA" : ""}</span>
        </div>
        {low && <p className="lowbar">
          {stats.remaining <= 0 ? "The card is empty. Time to buy more."
            : "Only " + stats.remaining + " left. Worth buying more soon."}
        </p>}
      </section>

      <section className="daily">
        <p className="eyebrow tan">{daily.kind === "breed" ? "Breed of the day" : "Today's horse fact"}</p>
        {daily.kind === "breed"
          ? <div className="breedrow">
              <Horse breed={daily.item} />
              <div>
                <h2 className="breedname">{daily.item.name}</h2>
                <p className="breedorigin">{daily.item.origin}</p>
                <p className="breednote">{daily.item.note}</p>
              </div>
            </div>
          : <p className="fact">{daily.item}</p>}
      </section>

      <section className="strip">
        <div><span className="strip-k">Paid to date</span><span className="strip-v">{money(stats.paid)}</span></div>
        <div><span className="strip-k">Per lesson</span><span className="strip-v">{stats.avg === null ? "\u2014" : money(stats.avg)}</span></div>
        <div><span className="strip-k">Booked ahead</span><span className="strip-v">{stats.booked}</span></div>
      </section>

      <nav className="tabs">
        {[["card","Ride log"],["buy","Purchases"],["fix","Adjustments"]].map(t =>
          <button key={t[0]} className={tab === t[0] ? "tab on" : "tab"} onClick={() => setTab(t[0])}>{t[1]}</button>)}
      </nav>

      {tab === "card" && <RideLog rides={rides} today={today} onAdd={addRide} onSet={setRide} onDel={delRide} />}
      {tab === "buy" && <Purchases items={data.purchases} onAdd={addPurchase} onSet={setPurchase} onDel={delPurchase} spend={spend} />}
      {tab === "fix" && <Adjustments items={data.adjustments} onAdd={addAdj} onDel={delAdj} today={today} />}

      <footer className="foot">
        <button className="btn ghost" onClick={exportCSV}>Export a backup (CSV)</button>
        {!confirmWipe
          ? <button className="btn ghost danger" onClick={() => setConfirmWipe(true)}>Clear everything</button>
          : <div className="wipe">
              <span>Delete all lessons and purchases?</span>
              <button className="btn danger" onClick={() => { setData({riderName:data.riderName,purchases:[],rides:[],adjustments:[]}); setConfirmWipe(false); }}>Yes, clear it</button>
              <button className="btn ghost" onClick={() => setConfirmWipe(false)}>Keep it</button>
            </div>}
        <p className="footnote">Export a copy now and then so there is a file to fall back on.</p>
      </footer>
    </div>
  );
}

/* ============================================================
   Ride log
   ============================================================ */
function RideLog({ rides, today, onAdd, onSet, onDel }) {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState({ date: today, time:"", status:"ridden", note:"", iea:false });
  const [editing, setEditing] = useState(null);

  return (
    <section>
      <div className="quick">
        <button className="btn primary" onClick={() => onAdd({date:today,status:"ridden",note:""})}>Rode today</button>
        <button className="btn" onClick={() => onAdd({date:today,status:"ridden",note:"",iea:true})}>IEA today</button>
        <button className="btn" onClick={() => onAdd({date:"",status:"ridden",note:"Date not recorded"})}>Used one, no date</button>
        <button className="btn" onClick={() => setOpen(o => !o)}>{open ? "Close" : "Add a lesson"}</button>
      </div>

      {open &&
        <div className="form">
          <label>Date
            <input type="date" value={form.date} onChange={e => setForm(Object.assign({},form,{date:e.target.value}))} />
            <span className="hint">Leave empty to use a lesson without a date.</span>
          </label>
          <label>Time
            <input type="time" value={form.time} onChange={e => setForm(Object.assign({},form,{time:e.target.value}))} />
          </label>
          <label>Status
            <select value={form.status} onChange={e => setForm(Object.assign({},form,{status:e.target.value}))}>
              <option value="ridden">Ridden, counts against the card</option>
              <option value="booked">Booked, counts once the day passes</option>
              <option value="canceled">Canceled, does not count</option>
            </select>
          </label>
          <label className="wide check">
            <input type="checkbox" checked={!!form.iea} onChange={e => setForm(Object.assign({},form,{iea:e.target.checked}))} />
            IEA lesson, does not count against private lessons
          </label>
          <label className="wide">Note
            <input value={form.note} placeholder="Instructor, horse, rescheduled from&hellip;"
                   onChange={e => setForm(Object.assign({},form,{note:e.target.value}))} />
          </label>
          <button className="btn primary wide" onClick={() => {
            onAdd(Object.assign({}, form));
            setForm({date:today,time:"",status:"ridden",note:"",iea:false});
            setOpen(false);
          }}>Save lesson</button>
        </div>}

      {rides.length === 0 && <p className="empty">No lessons logged yet. Add the first one above.</p>}

      <ul className="list">
        {rides.map(r =>
          <li key={r.id} className={"row " + (r.iea && r.effective !== "canceled" ? "iea" : r.effective)}>
            <div className="row-main">
              <div className="row-top">
                <span className="row-date">
                  {r.date ? fmtDate(r.date) : "No date recorded"}{r.time ? " \u00b7 " + fmtTime(r.time) : ""}
                </span>
                <span style={{display:"flex",gap:6}}>
                  {r.iea && <span className="pill iea">IEA</span>}
                  <span className={"pill " + r.effective}>
                    {r.effective === "ridden" ? "Ridden" : r.effective === "booked" ? "Booked" : "Canceled"}
                  </span>
                </span>
              </div>
              {r.auto && <p className="autonote">Counted automatically because the day passed. Mark it canceled if she did not ride.</p>}
              {editing === r.id
                ? <div className="editrow">
                    <input type="date" value={r.date} onChange={e => onSet(r.id,{date:e.target.value})} />
                    <input type="time" value={r.time} onChange={e => onSet(r.id,{time:e.target.value})} />
                    <input value={r.note} placeholder="Note" onChange={e => onSet(r.id,{note:e.target.value})} />
                  </div>
                : r.note && <p className="rownote">{r.note}</p>}
              <div className="rowacts">
                {r.effective !== "ridden" && <button className="mini" onClick={() => onSet(r.id,{status:"ridden"})}>Mark ridden</button>}
                {r.effective !== "booked" && <button className="mini" onClick={() => onSet(r.id,{status:"booked"})}>Mark booked</button>}
                {r.effective !== "canceled" && <button className="mini" onClick={() => onSet(r.id,{status:"canceled"})}>Mark canceled</button>}
                <button className="mini" onClick={() => onSet(r.id,{iea:!r.iea})}>{r.iea ? "Make private" : "Make IEA"}</button>
                <button className="mini" onClick={() => setEditing(editing === r.id ? null : r.id)}>{editing === r.id ? "Done" : "Edit"}</button>
                <button className="mini warn" onClick={() => onDel(r.id)}>Delete</button>
              </div>
            </div>
          </li>)}
      </ul>
    </section>
  );
}

/* ============================================================
   Purchases
   ============================================================ */
const blankBuy = (t) => ({date:t,lessons:"",amount:"",perLesson:"",payType:"card",cardName:"",checkNumber:"",note:""});

function Purchases({ items, onAdd, onSet, onDel, spend }) {
  const today = todayISO();
  const [open, setOpen] = useState(false);
  const [f, setF] = useState(blankBuy(today));
  const [editing, setEditing] = useState(null);
  const up = (c) => setF(Object.assign({}, f, c));

  const autoPer = f.lessons && f.amount && Number(f.lessons) > 0
    ? (Number(f.amount)/Number(f.lessons)).toFixed(2) : "";
  const max = Math.max.apply(null, spend.map(s => s[1]).concat([1]));

  return (
    <section>
      <div className="quick">
        <button className="btn primary" onClick={() => setOpen(o => !o)}>{open ? "Close" : "Record a purchase"}</button>
      </div>

      {open &&
        <div className="form">
          <label>Date purchased<input type="date" value={f.date} onChange={e => up({date:e.target.value})} /></label>
          <label>Lessons bought<input type="number" inputMode="numeric" value={f.lessons} onChange={e => up({lessons:e.target.value})} /></label>
          <label>Amount charged<input type="number" inputMode="decimal" step="0.01" placeholder="0.00" value={f.amount} onChange={e => up({amount:e.target.value})} /></label>
          <label>Per lesson
            <input type="number" inputMode="decimal" step="0.01" placeholder={autoPer || "0.00"} value={f.perLesson} onChange={e => up({perLesson:e.target.value})} />
            <span className="hint">Fills in on its own. Override it if a discount applied.</span>
          </label>
          <label>Paid with
            <select value={f.payType} onChange={e => up({payType:e.target.value})}>
              <option value="card">Credit card</option>
              <option value="check">Check</option>
              <option value="other">Cash or other</option>
              <option value="unknown">Not recorded</option>
            </select>
          </label>
          {f.payType === "card" && <label>Card<input value={f.cardName} placeholder="Name on the card, or which card" onChange={e => up({cardName:e.target.value})} /></label>}
          {f.payType === "check" && <label>Check number<input value={f.checkNumber} inputMode="numeric" onChange={e => up({checkNumber:e.target.value})} /></label>}
          <label className="wide">Note<input value={f.note} placeholder="Package name, discount, promotion" onChange={e => up({note:e.target.value})} /></label>
          <button className="btn primary wide" onClick={() => {
            if (!f.lessons) return;
            onAdd(Object.assign({}, f, {perLesson: f.perLesson || autoPer}));
            setF(blankBuy(today)); setOpen(false);
          }}>Save purchase</button>
        </div>}

      {spend.length > 0 &&
        <div className="chart">
          <p className="eyebrow tan">Spending by month</p>
          <div className="bars">
            {spend.map(s => {
              const p = s[0].split("-");
              return (
                <div className="bar" key={s[0]}>
                  <span className="barval">{money(s[1])}</span>
                  <div className="barfill" style={{height: Math.max((s[1]/max)*90,6) + "px"}} />
                  <span className="barlab">{new Date(Number(p[0]),Number(p[1])-1,1).toLocaleDateString("en-US",{month:"short"})}</span>
                </div>);
            })}
          </div>
        </div>}

      {items.length === 0 && <p className="empty">No purchases recorded yet.</p>}

      <ul className="list">
        {items.map(p =>
          <li key={p.id} className="row buy">
            <div className="row-main">
              <div className="row-top">
                <span className="row-date">{fmtDate(p.date)}</span>
                <span className="lessons-tag">+{p.lessons}</span>
              </div>
              <p className="buyline">{money(p.amount)}{p.perLesson ? " \u00b7 " + money(p.perLesson) + " each" : ""}</p>
              <p className="rownote">
                {p.payType === "card" ? "Card: " + (p.cardName || "not noted")
                  : p.payType === "check" ? "Check " + (p.checkNumber || "number not noted")
                  : p.payType === "other" ? "Cash or other" : "Payment not recorded"}
                {p.note ? " \u00b7 " + p.note : ""}
              </p>

              {editing === p.id &&
                <div className="form inline">
                  <label>Date<input type="date" value={p.date} onChange={e => onSet(p.id,{date:e.target.value})} /></label>
                  <label>Lessons<input type="number" value={p.lessons} onChange={e => onSet(p.id,{lessons:e.target.value})} /></label>
                  <label>Amount
                    <input type="number" step="0.01" value={p.amount} onChange={e => {
                      const amount = e.target.value;
                      const per = amount && Number(p.lessons) > 0 ? (Number(amount)/Number(p.lessons)).toFixed(2) : p.perLesson;
                      onSet(p.id,{amount, perLesson: per});
                    }} />
                  </label>
                  <label>Per lesson<input type="number" step="0.01" value={p.perLesson} onChange={e => onSet(p.id,{perLesson:e.target.value})} /></label>
                  <label>Paid with
                    <select value={p.payType} onChange={e => onSet(p.id,{payType:e.target.value})}>
                      <option value="card">Credit card</option>
                      <option value="check">Check</option>
                      <option value="other">Cash or other</option>
                      <option value="unknown">Not recorded</option>
                    </select>
                  </label>
                  {p.payType === "card" && <label>Card<input value={p.cardName} onChange={e => onSet(p.id,{cardName:e.target.value})} /></label>}
                  {p.payType === "check" && <label>Check number<input value={p.checkNumber} onChange={e => onSet(p.id,{checkNumber:e.target.value})} /></label>}
                  <label className="wide">Note<input value={p.note} onChange={e => onSet(p.id,{note:e.target.value})} /></label>
                </div>}

              <div className="rowacts">
                <button className="mini" onClick={() => setEditing(editing === p.id ? null : p.id)}>{editing === p.id ? "Done" : "Edit"}</button>
                <button className="mini warn" onClick={() => onDel(p.id)}>Delete</button>
              </div>
            </div>
          </li>)}
      </ul>
    </section>
  );
}

/* ============================================================
   Adjustments
   ============================================================ */
function Adjustments({ items, onAdd, onDel, today }) {
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");

  return (
    <section>
      <p className="explain">
        Use this when the barn's count and this app disagree. A positive number adds lessons to the card,
        a negative number takes them away.
      </p>
      <div className="form">
        <label>Lessons<input type="number" inputMode="numeric" placeholder="-1 or 2" value={amount} onChange={e => setAmount(e.target.value)} /></label>
        <label className="wide">Why<input value={note} placeholder="Barn credited a late cancel" onChange={e => setNote(e.target.value)} /></label>
        <button className="btn primary wide" onClick={() => {
          if (!amount) return;
          onAdd({date:today, amount:Number(amount), note});
          setAmount(""); setNote("");
        }}>Save adjustment</button>
      </div>

      {items.length === 0 && <p className="empty">No adjustments. The count is clean.</p>}

      <ul className="list">
        {items.map(a =>
          <li key={a.id} className="row buy">
            <div className="row-main">
              <div className="row-top">
                <span className="row-date">{fmtDate(a.date)}</span>
                <span className={a.amount < 0 ? "lessons-tag neg" : "lessons-tag"}>{a.amount > 0 ? "+" + a.amount : a.amount}</span>
              </div>
              {a.note && <p className="rownote">{a.note}</p>}
              <div className="rowacts"><button className="mini warn" onClick={() => onDel(a.id)}>Delete</button></div>
            </div>
          </li>)}
      </ul>
    </section>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
